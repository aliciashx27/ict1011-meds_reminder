<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meds keychain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14232E;--muted:#586871;--paper:#F2F6F5;--card:#FFFFFF;--line:#D3DDDA;--green:#1F6F5C;--amber:#F2B04A;--red:#A83226;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:24px;margin:0}
h2{font-size:20px;margin:28px 0 10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
button,input{font:inherit;color:inherit}
button{min-height:52px;padding:0 18px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.small{min-height:40px;padding:0 12px;font-size:16px;border-color:var(--line);color:var(--red)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pill{min-height:40px;font-size:15px;border-radius:99px;padding:0 14px;border-color:var(--line)}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.next{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px 20px;margin-top:18px}
.next small{color:#B8C7CF;font-size:16px}
.next .t{font-size:44px;font-weight:700;line-height:1.1;color:var(--amber)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.row .grow{flex:1;min-width:0}
.row b{display:block}
.row span{color:var(--muted);font-size:16px}
.time{font-weight:700;font-size:20px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=time]{width:100%;min-height:52px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card)}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days label{margin:0;font-weight:400}
.days input{position:absolute;opacity:0}
.days span{display:inline-block;min-width:48px;text-align:center;padding:10px 0;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card)}
.days input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.days input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.err{color:var(--red);font-weight:700;min-height:1.5em;margin:8px 0 0}
.empty{color:var(--muted);padding:6px 0}
details{margin-top:28px}
pre{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:14px;max-height:200px;overflow:auto;white-space:pre-wrap}
.foot{color:var(--muted);font-size:14px;margin-top:28px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:var(--ink);color:#fff;padding:14px 16px;border-radius:var(--r);display:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>Meds keychain</h1>
    <button id="status" class="pill" type="button">Not connected</button>
  </header>

  <section class="next" aria-live="polite">
    <small>Next dose</small>
    <div class="t" id="nextTime">--:--</div>
    <div id="nextName">Add a medication to begin</div>
  </section>

  <div class="actions">
    <button id="connect" type="button">Connect keychain</button>
    <button id="sync" class="primary" type="button">Sync keychain</button>
  </div>

  <h2>Your medications</h2>
  <div id="list"></div>

  <h2>Add medication</h2>
  <div>
    <label for="name">Name (up to 8 letters)</label>
    <input id="name" type="text" maxlength="8" autocomplete="off" placeholder="Panado">
    <label for="time">Time</label>
    <input id="time" type="time">
    <label>Days</label>
    <div class="days" id="days"></div>
    <label for="msg">Message on the keychain (up to 16 letters)</label>
    <input id="msg" type="text" maxlength="16" autocomplete="off" placeholder="With food">
    <p class="err" id="err" role="alert"></p>
    <button id="save" class="primary" type="button" style="width:100%">Save medication</button>
  </div>

  <h2>Taken doses</h2>
  <div id="history"></div>

  <details>
